<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="2">
  <title>Icon Preview</title>
  <style>
    body { background: #1e1e1e; font-family: sans-serif; padding: 40px; margin: 0; }
    h1 { color: #ccc; font-size: 14px; margin-bottom: 30px; letter-spacing: 1px; text-transform: uppercase; }
    .grid { display: flex; gap: 40px; flex-wrap: wrap; }
    .card {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      background: #2d2d2d; border-radius: 12px; padding: 24px 28px;
      min-width: 120px;
    }
    .card label { color: #aaa; font-size: 12px; text-align: center; line-height: 1.4; }
    .icon-row { display: flex; gap: 20px; align-items: center; }
    .size-label { color: #666; font-size: 10px; text-align: center; }
    .dark { color: #cccccc; }
    .light-bg { background: #f5f5f5; border-radius: 8px; padding: 8px; color: #333; }

    /* Activity Bar 시뮬레이션 */
    .activitybar {
      background: #333333; width: 48px; border-radius: 8px; padding: 8px 0;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .ab-icon {
      width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
      color: #858585; cursor: pointer;
    }
    .ab-icon.active { color: #ffffff; border-left: 2px solid #ffffff; }
    .ab-icon svg { width: 24px; height: 24px; }
  </style>
</head>
<body>
  <h1>Skill Inventory — Icon Options</h1>
  <div class="grid">

    <div class="card">
      <div class="icon-row">
        <div>
          <div class="size-label" style="margin-bottom:6px">24px (dark)</div>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#cccccc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            <line x1="9" y1="8" x2="15" y2="8"/>
            <line x1="9" y1="12" x2="15" y2="12"/>
            <line x1="9" y1="16" x2="12" y2="16"/>
          </svg>
        </div>
        <div>
          <div class="size-label" style="margin-bottom:6px">24px (light)</div>
          <div class="light-bg">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
              <line x1="9" y1="8" x2="15" y2="8"/>
              <line x1="9" y1="12" x2="15" y2="12"/>
              <line x1="9" y1="16" x2="12" y2="16"/>
            </svg>
          </div>
        </div>
        <div class="activitybar">
          <div class="ab-icon active">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
              <line x1="9" y1="8" x2="15" y2="8"/>
              <line x1="9" y1="12" x2="15" y2="12"/>
              <line x1="9" y1="16" x2="12" y2="16"/>
            </svg>
          </div>
        </div>
      </div>
      <label>1. 책 + 목록<br><span style="color:#666">Book List</span></label>
    </div>

    <div class="card">
      <div class="icon-row">

              <circle cx="12" cy="8" r="6"/>
              <polygon points="12 5 13.1 7.3 15.6 7.6 13.8 9.3 14.2 11.8 12 10.6 9.8 11.8 10.2 9.3 8.4 7.6 10.9 7.3 12 5"/>
              <path d="M8.56 13.69l-1.5 6.06L12 18l4.94 1.75-1.5-6.06"/>
            </svg>

        </div>
        <div class="activitybar">
          <div class="ab-icon active">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="6"/>
              <polygon points="12 5 13.1 7.3 15.6 7.6 13.8 9.3 14.2 11.8 12 10.6 9.8 11.8 10.2 9.3 8.4 7.6 10.9 7.3 12 5"/>
              <path d="M8.56 13.69l-1.5 6.06L12 18l4.94 1.75-1.5-6.06"/>
            </svg>
          </div>
        </div>
      </div>
      <label>2. 별 뱃지<br><span style="color:#666">Star Badge</span></label>
    </div>

    <div class="card">
      <div class="icon-row">

              <rect x="3" y="3" width="8" height="8" rx="1.5"/>

    <div class="card">
      <div class="icon-row">

</body>
